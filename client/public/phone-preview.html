<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ABC Project — phone preview</title>
  <style>
    html, body { margin: 0; background: #1b2328; }
    .row { display: flex; gap: 24px; padding: 24px; align-items: flex-start; transform: scale(.45); transform-origin: top left; }
    .phone { width: 390px; height: 844px; border: 10px solid #0b0f12; border-radius: 34px; overflow: hidden; flex: 0 0 auto; }
    .phone.land { width: 844px; height: 390px; }
    iframe { width: 100%; height: 100%; border: 0; display: block; }
  </style>
</head>
<body>
  <div class="row">
    <div class="phone"><iframe src="/?preview=portrait"></iframe></div>
    <div class="phone land"><iframe src="/?preview=landscape"></iframe></div>
  </div>
</body>
</html>
